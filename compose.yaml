services:
  postgres:
    image: postgres:16-alpine
    container_name: toktickit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit
      POSTGRES_DB: toktickit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toktickit -d toktickit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - toktickit-postgres-data:/var/lib/postgresql/data

volumes:
  toktickit-postgres-data:
